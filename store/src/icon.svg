<?xml version="1.0" encoding="UTF-8"?>
<!--
  Google Play ストア用アプリアイコン（512x512 PNG の元）。

  app/src/main/res/drawable/ic_launcher_foreground.xml と
  values/ic_launcher_background.xml から移植した図柄（受話器 + 3 ドット）。

  アプリ内のアダプティブアイコンは、One UI などの squircle マスクで外周が
  切られないよう group scale 0.58 で縮小している（DECISIONS.md D-17）。
  ストア用アイコンにはマスクが掛からず、フルブリードの正方形として表示されるため、
  この縮小は解除し、図柄が正方形いっぱいに近づくよう拡大している
  （PLAY-RELEASE.md §6 / PLAY-LISTING.md §2 の指摘）。

  図柄の実バウンディングボックスは 108 単位系で w=74.0 / h=76.2、中心 (54, 53.1)。
  scale 1.08 で w=79.9（辺の 74%）/ h=82.3（辺の 76%）となり、四隅は背景色で埋まる。
  透過部分なし（ドットの fill-opacity 0.75 は背景色の上で合成される）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512" role="img" aria-label="Prefix Dialer">
  <rect width="108" height="108" fill="#1B5E5A"/>
  <g transform="translate(54,54) scale(1.08) translate(-54,-53.1)" fill="#FFFFFF">
    <path d="M43.9,58.1c4.6,9 12,16.4 21,21l7,-7c0.9,-0.9 2.2,-1.2 3.3,-0.8c3.9,1.3 8.1,2 12.4,2c1.9,0 3.4,1.5 3.4,3.4v11.1c0,1.9 -1.5,3.4 -3.4,3.4C57.3,91.2 32.8,66.7 32.8,36.4c0,-1.9 1.5,-3.4 3.4,-3.4h11.1c1.9,0 3.4,1.5 3.4,3.4c0,4.3 0.7,8.5 2,12.4c0.4,1.2 0.1,2.4 -0.8,3.3L43.9,58.1z"/>
    <g fill-opacity="0.75">
      <circle cx="22" cy="20" r="5"/>
      <circle cx="40" cy="20" r="5"/>
      <circle cx="58" cy="20" r="5"/>
    </g>
  </g>
</svg>
