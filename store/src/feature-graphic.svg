<?xml version="1.0" encoding="UTF-8"?>
<!--
  Google Play フィーチャー グラフィック 1024x500。
  左にアプリアイコンの図柄（受話器 + 3 ドット）、右にアプリ名と英語タグライン。
  日本語テキストは入れない（ヘッドレス描画で日本語フォントが無いと豆腐になるため）。
  背景はアイコン背景色 #1B5E5A を基調にした縦グラデーション。アルファなしで書き出す。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500" role="img" aria-label="Prefix Dialer - Adds your carrier prefix, automatically">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22726C"/>
      <stop offset="1" stop-color="#154A47"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- 装飾: 右下に薄い円（図柄・文字に掛からない位置） -->
  <circle cx="980" cy="470" r="200" fill="#FFFFFF" fill-opacity="0.04"/>

  <!-- 左: アイコンタイル（108 単位系の図柄を 220px のタイルに収める） -->
  <g transform="translate(64,140)">
    <rect width="220" height="220" rx="50" fill="#12403D"/>
    <!-- icon.svg と同じ配置（図柄の bbox 中心 (54,53.1) をタイル中心へ、scale 1.08） -->
    <g transform="scale(2.037) translate(54,54) scale(1.08) translate(-54,-53.1)" fill="#FFFFFF">
      <path d="M43.9,58.1c4.6,9 12,16.4 21,21l7,-7c0.9,-0.9 2.2,-1.2 3.3,-0.8c3.9,1.3 8.1,2 12.4,2c1.9,0 3.4,1.5 3.4,3.4v11.1c0,1.9 -1.5,3.4 -3.4,3.4C57.3,91.2 32.8,66.7 32.8,36.4c0,-1.9 1.5,-3.4 3.4,-3.4h11.1c1.9,0 3.4,1.5 3.4,3.4c0,4.3 0.7,8.5 2,12.4c0.4,1.2 0.1,2.4 -0.8,3.3L43.9,58.1z"/>
      <g fill-opacity="0.75">
        <circle cx="22" cy="20" r="5"/>
        <circle cx="40" cy="20" r="5"/>
        <circle cx="58" cy="20" r="5"/>
      </g>
    </g>
  </g>

  <!-- 右: アプリ名とタグライン -->
  <text x="324" y="244" font-family="DejaVu Sans" font-size="78" font-weight="bold" fill="#FFFFFF">Prefix Dialer</text>
  <text x="324" y="306" font-family="DejaVu Sans" font-size="32" fill="#FFFFFF" fill-opacity="0.88">Adds your carrier prefix, automatically</text>
</svg>
